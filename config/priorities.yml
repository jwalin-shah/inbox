# Inbox priorities — user-owned, never auto-updated by agent
# Add senders and keywords that should boost triage urgency score by +1

priority_senders:
  - tierra@cerebras.net
  - jack@jackandjill.ai  # Job recruiter
  - dave@jobs.bandana.com  # Recruiter (Bandana)
  - user-e65a8e09c91dc79cdac854bf73c74dd1@waymo.mail.clinchtalent.com  # Waymo recruiting
  - apply@ycombinator.com  # YC recruiting
  # add more as needed

priority_keywords:
  - "action required"
  - "offer"
  - "interview"
  - "urgent"
  - "deadline"
  - "rejection"
  - "application"
  - "job"
  - "onsite"
  - "screening"
  - "next steps"
  - "phone screen"
  - "system design"
  - "take home"

# Threads matching these patterns score 1 (ignore) regardless of other signals
low_signal_patterns:
  - "noreply@"
  - "no-reply@"
  - "unsubscribe"
  - "notifications@"
  - "do-not-reply"

# Gmail label IDs to treat as high priority (use GET /gmail/labels to find IDs)
priority_labels:
  - Label_36  # Triage/Jobs (job applications + rejections)
  - Label_20  # Triage/Critical (urgent items)

# Special handling for job rejections (auto-archive but log)
# When triage sees "rejected" or "rejection", action should be "log" not "archive"
rejection_keywords:
  - "rejection"
  - "rejected"
  - "unfortunately"
  - "not moving forward"
  - "not a fit"
  - "we've decided"
